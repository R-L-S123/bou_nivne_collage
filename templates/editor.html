<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>עריכת קולאז׳</title>

<link rel="stylesheet" href="/static/style.css">
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>


<style>

.editor {

    position: relative;
    width: 90vw;
    max-width: 600px;
    aspect-ratio: 1;
    margin: 30px auto;
    overflow: hidden;

}


.layer {

    position: absolute;

    width: 100%;
    height: 100%;

    top: 0;
    left: 0;

    object-fit: contain;

}


#grid {

    cursor: grab;
    touch-action: none;
    transform-origin: center center;

}


#overlay {

    pointer-events: none;

}


#drag-area {

    position: absolute;

    inset: 0;

    cursor: grab;

    touch-action: none;

}


</style>

</head>


<body>


<div class="editor">


<img
id="grid"
class="layer"
src="/{{ grid_path }}">


<img
id="overlay"
class="layer"
src="/{{ overlay_path }}">


<div id="drag-area"></div>


</div>



<button
id="create"
class="button">

צור קולאז׳

</button>



<script>


const grid =
document.getElementById("grid");


const dragArea =
document.getElementById("drag-area");



let x = 0;
let y = 0;
let scale = 1;



function update(){

    grid.style.transform =
    `
    translate(${x}px, ${y}px)
    scale(${scale})
    `;

}





// ======================
// גרירה מחשב
// ======================


let dragging = false;

let startX = 0;
let startY = 0;



dragArea.addEventListener(
"mousedown",
(e)=>{


    dragging = true;


    startX =
    e.clientX - x;


    startY =
    e.clientY - y;


    dragArea.style.cursor =
    "grabbing";


});



window.addEventListener(
"mousemove",
(e)=>{


    if(!dragging)
        return;


    x =
    e.clientX - startX;


    y =
    e.clientY - startY;


    update();


});



window.addEventListener(
"mouseup",
()=>{


    dragging = false;


    dragArea.style.cursor =
    "grab";


});





// ======================
// זום מחשב
// ======================


dragArea.addEventListener(
"wheel",
(e)=>{


    e.preventDefault();


    if(e.deltaY < 0){

        scale += 0.05;

    }
    else {

        scale -= 0.05;

    }


    if(scale < 0.5)
        scale = 0.5;


    if(scale > 5)
        scale = 5;


    update();


},
{
    passive:false
});





// ======================
// מובייל - גרירה וזום
// ======================


let lastTouchDistance = null;


dragArea.addEventListener(
"touchmove",
(e)=>{


    e.preventDefault();


    // גרירה עם אצבע אחת

    if(e.touches.length === 1){


        const touch =
        e.touches[0];


        if(!lastTouchDistance){

            if(!dragArea.startTouch){

                dragArea.startTouch = {

                    x: touch.clientX - x,
                    y: touch.clientY - y

                };

            }


            x =
            touch.clientX -
            dragArea.startTouch.x;


            y =
            touch.clientY -
            dragArea.startTouch.y;


            update();

        }


    }



    // זום שתי אצבעות

    if(e.touches.length === 2){


        const a =
        e.touches[0];


        const b =
        e.touches[1];


        const distance =
        Math.hypot(
            a.clientX - b.clientX,
            a.clientY - b.clientY
        );



        if(lastTouchDistance){


            const diff =
            distance -
            lastTouchDistance;



            scale +=
            diff * 0.005;



            if(scale < 0.5)
                scale = 0.5;


            if(scale > 5)
                scale = 5;


            update();


        }


        lastTouchDistance =
        distance;


    }


},
{
    passive:false
});



dragArea.addEventListener(
"touchend",
()=>{


    dragArea.startTouch =
    null;


    lastTouchDistance =
    null;


});





// ======================
// יצירת קולאז׳
// ======================
document
.getElementById("create")
.addEventListener(
"click",
async ()=>{


    const editor =
    document.querySelector(".editor");


    const canvas =
    await html2canvas(
        editor,
        {
            backgroundColor: "white",
            scale: 2
        }
    );


    const image =
    canvas.toDataURL(
        "image/png"
    );



    await fetch(
        "/save_image",
        {

            method:"POST",

            headers:{
                "Content-Type":
                "application/json"
            },

            body:JSON.stringify(
                {
                    image:image
                }
            )

        }
    );



    window.location.href =
    "/gallery";


});

</script>


</body>

</html>
