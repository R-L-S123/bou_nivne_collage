<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>עריכת קולאז׳</title>

<link rel="stylesheet" href="/static/style.css">


<style>

.editor {

    position: relative;
    width: 90vw;
    max-width: 600px;
    aspect-ratio: 1;
    margin: 30px auto;
    overflow: hidden;

}


.layer {

    position: absolute;
    width: 100%;
    height: 100%;
    object-fit: contain;
    top: 0;
    left: 0;
    user-select: none;

}


#grid {

    touch-action: none;

}


#mask {

    pointer-events: none;

}


#drag-area {

    position: absolute;
    width: 100%;
    height: 100%;
    top: 0;
    left: 0;
    cursor: grab;
    z-index: 10;
    touch-action: none;

}


</style>


</head>


<body>


<h1>
עריכת קולאז׳ ❤️
</h1>


<p>
גרור את התמונות מתחת ללב
</p>



<div class="editor">


    <img
    id="grid"
    class="layer"
    src="/{{ grid_path }}">


    <img
    id="mask"
    class="layer"
    src="/{{ mask_path }}">


    <div id="drag-area"></div>


</div>



<button
class="button"
id="create">

צור קולאז׳

</button>



<script>


const grid = document.getElementById("grid");
const dragArea = document.getElementById("drag-area");


let dragging = false;

let startX = 0;
let startY = 0;

let currentX = 0;
let currentY = 0;



function startDrag(x, y) {

    dragging = true;

    startX = x - currentX;
    startY = y - currentY;

}



function moveDrag(x, y) {

    if (!dragging)
        return;


    currentX = x - startX;
    currentY = y - startY;


    grid.style.transform =
    `translate(${currentX}px, ${currentY}px)`;

}



function stopDrag() {

    dragging = false;

}



// עכבר

dragArea.addEventListener(
"mousedown",
(e)=>{

    startDrag(
        e.clientX,
        e.clientY
    );

});



window.addEventListener(
"mousemove",
(e)=>{

    moveDrag(
        e.clientX,
        e.clientY
    );

});



window.addEventListener(
"mouseup",
stopDrag
);



// טלפון

dragArea.addEventListener(
"touchstart",
(e)=>{

    const touch = e.touches[0];

    startDrag(
        touch.clientX,
        touch.clientY
    );

});



window.addEventListener(
"touchmove",
(e)=>{

    const touch = e.touches[0];

    moveDrag(
        touch.clientX,
        touch.clientY
    );

});



window.addEventListener(
"touchend",
stopDrag
);



document
.getElementById("create")
.addEventListener(
"click",
async ()=>{


    await fetch(
        "/create_collage",
        {

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify(
                {
                    x: currentX,
                    y: currentY
                }
            )

        }
    );


    alert("המיקום נשמר");

});


</script>


</body>

</html>
